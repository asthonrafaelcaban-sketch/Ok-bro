
      - name: Extract project ZIP if needed
        run: |
          if [ ! -f gradlew ]; then
            unzip -oq OpenPrestige-GitHub-Actions.zip -d extracted
          fi

          GRADLEW=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon build