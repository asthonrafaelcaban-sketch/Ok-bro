
name: Build OpenPrestige

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP if needed
        run: |
          if [ ! -f gradlew ]; then
            ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No Gradle project found."
              exit 1
            fi
            mkdir extracted
            unzip -q "$ZIP" -d extracted
            cp -r extracted/.[!.]* . 2>/dev/null || true
            cp -r extracted/* . 2>/dev/null || true
          fi

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenPrestige-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          
